name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches advisories published against unchanged dependencies.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
