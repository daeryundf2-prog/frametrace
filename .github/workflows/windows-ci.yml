name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Viewer JavaScript syntax
        run: node --check gui/evidence-viewer/app.js
      - name: QA performance smoke
        run: cargo run --locked -- qa performance target/frametrace-ci-performance --rows 1000
      - name: Release build
        run: cargo build --release --locked
