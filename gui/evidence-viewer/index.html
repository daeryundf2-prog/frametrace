<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FrameTrace 증거 뷰어</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./workflow.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">FT</div>
          <div>
            <h1>FrameTrace</h1>
            <p data-i18n="app.subtitle">증거 뷰어</p>
          </div>
        </div>
        <div class="case-strip" aria-label="사건 요약" data-i18n-aria-label="case.summaryAria">
          <span data-i18n="case.id">사건 FT-2026-0519</span>
          <span data-i18n="case.description">의뢰인 CCTV/블랙박스 입수</span>
          <span data-i18n="case.prototype">프로토타입 세션</span>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="languageButton" type="button" title="Switch language" aria-label="Switch language" data-i18n-title="lang.switch" data-i18n-aria-label="lang.switch">EN</button>
          <button class="icon-button" id="syncViewButton" type="button" title="동기화 채널 보기 전환" aria-label="동기화 채널 보기 전환" data-i18n-title="sync.title" data-i18n-aria-label="sync.title">2ch</button>
          <button class="icon-button package-action" id="packageButton" type="button" title="사건 패키징" aria-label="사건 패키징" data-i18n-title="package.title" data-i18n-aria-label="package.title" data-i18n="package.title">사건 패키징</button>
        </div>
      </header>

      <main class="workspace">
        <section class="browser-pane" aria-label="증거 브라우저" data-i18n-aria-label="browser.aria">
          <div class="workbench-flow" id="workbenchFlow" aria-label="포렌식 작업 요약" data-i18n-aria-label="summary.aria"></div>
          <div class="browser-toolbar">
            <div class="segmented" id="filterTabs" role="tablist" aria-label="증거 필터" data-i18n-aria-label="filters.aria"></div>
            <label class="search-box">
              <span data-i18n="search.label">검색</span>
              <input id="searchInput" type="search" autocomplete="off" placeholder="경로, 해시, 파서, 메모" data-i18n-placeholder="search.placeholder">
            </label>
            <div class="inventory-metrics" aria-live="polite">
              <span id="resultCount">0</span>
              <span id="visibleWindow">0</span>
              <span id="queryLatency">0 ms</span>
            </div>
          </div>
          <div class="file-table" role="table" aria-label="색인된 증거 파일" data-i18n-aria-label="table.aria">
            <div class="file-row file-head" role="row">
              <span data-i18n="table.status">상태</span>
              <span data-i18n="table.review">검토</span>
              <span data-i18n="table.id">ID</span>
              <span data-i18n="table.name">이름</span>
              <span data-i18n="table.source">소스</span>
              <span data-i18n="table.time">시각</span>
              <span data-i18n="table.type">유형</span>
              <span data-i18n="table.validation">검증</span>
              <span data-i18n="table.size">크기</span>
              <span data-i18n="table.hash">해시</span>
              <span data-i18n="table.report">보고서</span>
              <span data-i18n="table.preview">미리보기</span>
            </div>
            <div id="fileRows" class="file-rows"></div>
          </div>
        </section>

        <section class="viewer-pane" aria-label="증거 뷰어" data-i18n-aria-label="viewer.aria">
          <div class="viewer-stage">
            <div class="viewer-toolbar">
              <div class="viewer-title">
                <span id="activeKind">영상</span>
                <strong id="activeName">-</strong>
              </div>
          <div class="viewer-toggles">
                <button class="tool-button active" type="button" data-overlay="metadata" data-i18n="overlay.metadata">메타</button>
                <button class="tool-button" type="button" data-overlay="levels" data-i18n="overlay.levels">레벨</button>
                <button class="tool-button" type="button" data-overlay="compare" data-i18n="overlay.compare">비교</button>
              </div>
            </div>
            <div class="media-frame">
              <canvas id="viewerCanvas" width="1280" height="720" aria-label="선택 증거 미리보기" data-i18n-aria-label="viewer.canvas"></canvas>
              <div class="frame-overlay">
                <span id="frameTimecode">00:00:00.000</span>
                <span id="frameBadge">ORIGINAL</span>
              </div>
            </div>
            <div class="viewer-evidence-rail" id="selectedEvidenceRail" aria-label="선택 증거 검토 작업" data-i18n-aria-label="viewer.railAria"></div>
            <div class="timeline">
              <div class="timeline-rail" id="timelineRail">
                <div class="timeline-range" id="timelineRange"></div>
                <div class="timeline-head" id="timelineHead"></div>
                <div class="timeline-events" id="timelineEvents"></div>
              </div>
              <div class="timeline-scale" id="timelineScale"></div>
            </div>
            <div class="transport">
              <button class="round-button" id="prevButton" type="button" title="이전 파일" aria-label="이전 파일" data-i18n-title="transport.prevFile" data-i18n-aria-label="transport.prevFile">&#9664;&#9664;</button>
              <button class="round-button" id="stepBackButton" type="button" title="이전 프레임" aria-label="이전 프레임" data-i18n-title="transport.prevFrame" data-i18n-aria-label="transport.prevFrame">&#9664;</button>
              <button class="round-button primary" id="playButton" type="button" title="재생/일시정지" aria-label="재생/일시정지" data-i18n-title="transport.playPause" data-i18n-aria-label="transport.playPause">&#9654;</button>
              <button class="round-button" id="stepForwardButton" type="button" title="다음 프레임" aria-label="다음 프레임" data-i18n-title="transport.nextFrame" data-i18n-aria-label="transport.nextFrame">&#9654;</button>
              <button class="round-button" id="nextButton" type="button" title="다음 파일" aria-label="다음 파일" data-i18n-title="transport.nextFile" data-i18n-aria-label="transport.nextFile">&#9654;&#9654;</button>
              <select id="speedSelect" aria-label="재생 속도" data-i18n-aria-label="transport.speed">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
              </select>
              <label class="range-input">
                <span data-i18n="transport.zoom">확대</span>
                <input id="zoomInput" type="range" min="1" max="4" step="0.25" value="1">
              </label>
            </div>
          </div>
        </section>

        <aside class="inspector-pane" aria-label="포렌식 인스펙터" data-i18n-aria-label="inspector.aria">
          <section class="inspector-section">
            <div class="panel-title" data-i18n="panel.fileState">파일 상태</div>
            <div class="status-card" id="statusCard"></div>
            <div class="review-actions">
              <button id="markReviewedButton" type="button" data-i18n="action.reviewed">검토완료</button>
              <button id="markImportantButton" type="button" data-i18n="action.important">중요</button>
              <button id="addReportButton" type="button" data-i18n="action.report">보고서</button>
            </div>
          </section>

          <section class="inspector-section">
            <div class="panel-title" data-i18n="panel.metadata">메타데이터</div>
            <dl class="meta-list" id="metaList"></dl>
          </section>

          <section class="inspector-section">
            <div class="panel-title" data-i18n="panel.outputQueue">출력 큐</div>
            <div class="output-grid">
              <button id="exportMp4Button" type="button" data-i18n="action.exportMp4">MP4 출력 대기</button>
              <button id="exportAviButton" type="button" data-i18n="action.exportAvi">AVI 출력 대기</button>
              <button id="captureFrameButton" type="button" data-i18n="action.frame">프레임</button>
              <button id="verifyButton" type="button" data-i18n="action.queueVerify">검증 대기</button>
            </div>
          </section>

        </aside>
      </main>
      <section class="evidence-preview" id="evidencePreview" role="dialog" aria-modal="false" aria-label="증거 미리보기" data-i18n-aria-label="preview.aria" hidden>
        <header class="preview-header">
          <div>
            <span class="preview-kicker" data-i18n="preview.kicker">local-first 미리보기</span>
            <strong id="previewTitle">증거 미리보기</strong>
          </div>
          <div class="preview-header-actions">
            <button class="tool-button" id="previewModeButton" type="button" data-i18n="preview.windowMode">창모드</button>
            <button class="tool-button" id="previewCloseButton" type="button" data-i18n="preview.close">닫기</button>
          </div>
        </header>
        <div class="preview-body">
          <div class="preview-media-frame">
            <canvas id="previewCanvas" width="1280" height="720" aria-label="선택 후보 미리보기" data-i18n-aria-label="preview.canvas"></canvas>
          </div>
          <aside class="preview-details" id="previewDetails"></aside>
        </div>
        <footer class="preview-actions">
          <button type="button" data-preview-command="report" data-i18n="preview.report">보고서 포함</button>
          <button type="button" data-preview-command="export" data-i18n="preview.export">MP4 내보내기 대기</button>
          <button type="button" data-preview-command="verify" data-i18n="preview.verify">검증 대기</button>
          <span data-i18n="preview.esc">Esc로 닫기</span>
        </footer>
      </section>
    </div>
    <script src="./translations.js"></script>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
