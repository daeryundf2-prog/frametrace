[package]
name = "frametrace"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "frametrace"
path = "src/lib.rs"

[[bin]]
name = "frametrace"
path = "src/main.rs"

[[bin]]
name = "frametrace-app"
path = "src/app.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
wait-timeout = "0.2"
